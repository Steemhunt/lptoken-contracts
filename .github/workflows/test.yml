name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.1

      - name: Verify dependency pins
        run: ./script/verify-source-pins.sh

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build

      - name: Test (non-fork)
        run: forge test --no-match-path "test/LpTokenFork*.t.sol"
